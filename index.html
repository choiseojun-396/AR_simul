<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR 프로토타입</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
      "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: -apple-system, system-ui, sans-serif; touch-action: manipulation; }
    #ar { position: fixed; inset: 0; }
    .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; color: #fff; background: #1b1b24; z-index: 10; }
    .panel h1 { margin: 0; font-size: 24px; }
    .panel p { margin: 0; opacity: .8; line-height: 1.5; }
    button { font-size: 18px; padding: 14px 28px; border: 0; border-radius: 999px; background: #ffcf3f; color: #222; font-weight: 700; }
    button:disabled { opacity: .5; }
    #status { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,.6); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 15px; white-space: nowrap; pointer-events: none; }
    #status:empty { display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="ar"></div>

  <div id="intro" class="panel">
    <h1>AR 캐릭터</h1>
    <p>인쇄한 마커 카드를 책상에 올려두고<br>시작을 누른 뒤 카메라로 비춰 주세요.</p>
    <button id="start">AR 시작</button>
  </div>

  <div id="inapp" class="panel" hidden style="z-index:30">
    <h1>외부 브라우저에서 열어 주세요</h1>
    <p>앱 안의 브라우저에서는 카메라 AR이 동작하지 않을 수 있어요.<br>Chrome 또는 Safari에서 열어 주세요.</p>
    <button id="copy">링크 복사</button>
  </div>

  <div id="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
