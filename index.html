<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR 프로토타입</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: -apple-system, system-ui, sans-serif; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #video, #gl { position: fixed; inset: 0; width: 100%; height: 100%; }
    #video { object-fit: cover; }
    #gl { touch-action: none; }
    .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; color: #fff; background: #1b1b24; z-index: 10; }
    .panel h1 { margin: 0; font-size: 24px; }
    .panel p { margin: 0; opacity: .8; line-height: 1.6; }
    button { font-size: 18px; padding: 14px 28px; border: 0; border-radius: 999px; background: #ffcf3f; color: #222; font-weight: 700; }
    button:disabled { opacity: .5; }

    /* 친밀도 */
    #love { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 14px; z-index: 20; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.88); padding: 8px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
    #love .bar { width: 90px; height: 8px; background: #eee; border-radius: 99px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: linear-gradient(90deg,#ff8fb1,#ff4f8b); transition: width .3s; }
    #love.pop { animation: pop .3s; }
    @keyframes pop { 50% { transform: scale(1.12); } }

    /* 오른쪽 버튼 */
    #side { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 14px; z-index: 20; display: flex; flex-direction: column; gap: 10px; }
    #side button { width: 56px; height: 56px; padding: 0; font-size: 26px; background: rgba(255,255,255,.88); display: flex; align-items: center; justify-content: center; }
    #side button span { display: none; }

    /* 애니메이션 버튼 */
    #anims { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 12px; }
    #anims button { font-size: 15px; padding: 10px 16px; background: rgba(255,255,255,.88); }
    #anims button.on { background: #ffcf3f; }

    #status { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,.6); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; max-width: 90vw; text-align: center; pointer-events: none; }
    #status:empty { display: none; }

    /* 사진 */
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
    #flash.go { animation: flash .4s; }
    @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
    #shot { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
    #shot img { max-width: 100%; max-height: 70vh; border-radius: 12px; -webkit-touch-callout: default; }
    #shot p { color: #ccc; margin: 0; font-size: 13px; }
    #shot .row { display: flex; gap: 10px; }
    #close { background: #fff; }

    /* 첫 화면 */
    #intro { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden;
      background: radial-gradient(circle at 20% 15%, #ffe3ef 0, transparent 45%), radial-gradient(circle at 85% 85%, #d9f0ff 0, transparent 50%), linear-gradient(160deg, #fff7d6, #ffeaf3 55%, #e3f4ff); }
    .floaty span { position: absolute; bottom: -40px; font-size: 26px; opacity: .8; animation: rise 7s linear infinite; }
    @keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: .8; } 100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
    .card { position: relative; z-index: 1; width: min(360px, 100%); background: rgba(255,255,255,.88); border-radius: 32px; padding: 28px 22px 22px; text-align: center; box-shadow: 0 12px 40px rgba(255,120,160,.18); }
    .card h1 { margin: 6px 0 4px; font-size: 26px; color: #2a2a35; letter-spacing: -.5px; }
    .card .sub { margin: 0 0 16px; color: #777; font-size: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 20px; }
    .chips span { background: #fff; border: 1.5px solid #f1e6ea; border-radius: 999px; padding: 7px 11px; font-size: 13px; font-weight: 600; color: #444; }
    #start { width: 100%; font-size: 19px; padding: 16px; box-shadow: 0 6px 0 #e5b21f; transition: transform .1s, box-shadow .1s; }
    #start:active { transform: translateY(4px); box-shadow: 0 2px 0 #e5b21f; }
    .card .note { margin: 12px 0 0; font-size: 12px; color: #999; }
    /* 캐릭터 일러스트 */
    .buddy { position: relative; width: 96px; height: 88px; margin: 6px auto 0; background: #9fd8ff; border-radius: 50% 50% 46% 46%; animation: bob 1.6s ease-in-out infinite; }
    .buddy .ear { position: absolute; top: -8px; width: 26px; height: 26px; background: #9fd8ff; border-radius: 50%; }
    .buddy .ear.l { left: 12px; } .buddy .ear.r { right: 12px; }
    .buddy .face { position: absolute; inset: 0; }
    .buddy .eye { position: absolute; top: 34px; width: 9px; height: 11px; background: #222233; border-radius: 50%; animation: blink 4s infinite; }
    .buddy .eye.l { left: 30px; } .buddy .eye.r { right: 30px; }
    .buddy .cheek { position: absolute; top: 48px; width: 14px; height: 9px; background: #ff9fb5; border-radius: 50%; opacity: .9; }
    .buddy .cheek.l { left: 16px; } .buddy .cheek.r { right: 16px; }
    .shadow { width: 70px; height: 10px; margin: 6px auto 0; background: rgba(0,0,0,.1); border-radius: 50%; animation: shade 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) scale(1.04,.96); } 50% { transform: translateY(-12px) scale(.97,1.03); } }
    @keyframes shade { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.75); opacity: .6; } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>

  <div id="love" hidden>💖 <span id="lv">Lv.1</span><div class="bar"><div id="fill"></div></div></div>
  <div id="side" hidden>
    <button id="snack" aria-label="간식 주기">🍪</button>
    <button id="photo" aria-label="사진 찍기">📷</button>
  </div>
  <div id="anims" hidden></div>
  <div id="status"></div>
  <div id="flash"></div>

  <div id="shot" hidden>
    <img id="shotimg" alt="찍은 사진" />
    <p>이미지를 길게 눌러도 저장할 수 있어요</p>
    <div class="row"><button id="save">저장·공유</button><button id="close">닫기</button></div>
  </div>

  <div id="intro">
    <div class="floaty" aria-hidden="true">
      <span style="left:8%;animation-delay:0s">💖</span><span style="left:22%;animation-delay:2.2s">⭐</span>
      <span style="left:40%;animation-delay:4.1s">🍪</span><span style="left:60%;animation-delay:1.1s">✨</span>
      <span style="left:76%;animation-delay:3.3s">💗</span><span style="left:90%;animation-delay:5.2s">⭐</span>
    </div>
    <div class="card">
      <div class="buddy" aria-hidden="true">
        <i class="ear l"></i><i class="ear r"></i>
        <div class="face"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i></div>
      </div>
      <div class="shadow" aria-hidden="true"></div>
      <h1>내 책상 위 친구</h1>
      <p class="sub">카메라를 켜면 캐릭터가 나타나요</p>
      <div class="chips">
        <span>👆 탭 · 동작</span><span>✋ 길게 · 쓰다듬기</span><span>↔️ 밀기 · 회전</span>
        <span>🤏 두 손가락 · 크기</span><span>🍪 간식</span><span>📷 사진</span>
      </div>
      <button id="start">AR 시작하기</button>
      <p class="note">카메라 · 동작 권한을 허용해 주세요</p>
    </div>
  </div>

  <div id="inapp" class="panel" hidden style="z-index:60">
    <h1>외부 브라우저에서 열어 주세요</h1>
    <p>앱 안의 브라우저에서는 카메라 AR이 동작하지 않을 수 있어요.<br>Chrome 또는 Safari에서 열어 주세요.</p>
    <button id="copy">링크 복사</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
