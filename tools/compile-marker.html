<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>마커 변환기</title>
  <style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.6}button{font-size:16px;padding:10px 20px}</style>
</head>
<body>
  <h2>마커 이미지 → targets.mind 변환</h2>
  <p>마커 이미지를 고르면 <code>targets.mind</code> 파일이 다운로드됩니다.<br>
  그 파일을 <code>assets/</code> 폴더에 넣으면 AR 시작이 빨라집니다.</p>
  <input type="file" id="file" accept="image/*" />
  <p id="log"></p>
  <script type="module">
    import * as MOD from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
    const Compiler = MOD.Compiler || window.MINDAR.IMAGE.Compiler;
    const log = (t) => (document.getElementById('log').textContent = t);
    document.getElementById('file').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
      const c = new Compiler();
      await c.compileImageTargets([img], (p) => log(`변환 중... ${Math.round(p)}%`));
      const data = await c.exportData();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data])); a.download = 'targets.mind'; a.click();
      log('완료! targets.mind 를 assets/ 폴더에 넣으세요.');
    };
  </script>
</body>
</html>
